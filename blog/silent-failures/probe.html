<!doctype html>
<html><head><meta charset="utf-8"><title>no-op probe</title>
<style>
  body{font:16px monospace;background:#0a1628;color:#bae6fd;padding:40px}
  #target{font:inherit;padding:20px 40px;background:#7dd3fc;color:#0a1628;border:0;cursor:pointer}
  #field{font:inherit;padding:12px;width:400px;display:block;margin-top:20px}
  #overlay{position:fixed;inset:0;z-index:9999;background:transparent;display:none}
  #log{margin-top:30px;white-space:pre-wrap;font-size:14px}
</style></head>
<body>
  <button id="target">CLICK TARGET</button>
  <input id="field" placeholder="type here">
  <div id="overlay"></div>
  <div id="log"></div>
<script>
  // ground truth: only the real handler increments these
  window.__clicks = 0
  window.__keys = 0
  window.__events = []
  const log = () => document.getElementById('log').textContent =
    'clicks=' + window.__clicks + ' keys=' + window.__keys

  document.getElementById('target').addEventListener('click', e => {
    window.__clicks++
    window.__events.push({ t: 'click', trusted: e.isTrusted, x: e.clientX, y: e.clientY })
    log()
  })
  document.getElementById('field').addEventListener('input', e => {
    window.__keys++
    log()
  })
  // overlay swallows clicks silently - no handler, just sits on top
  window.__overlay = on => { document.getElementById('overlay').style.display = on ? 'block' : 'none' }
  window.__reset = () => { window.__clicks = 0; window.__keys = 0; window.__events = []; log() }
  log()
</script>
</body></html>
