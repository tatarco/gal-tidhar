<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:#0a1628;color:#bae6fd;font-family:'SF Mono',Menlo,monospace;
    background-image:linear-gradient(rgba(125,211,252,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(125,211,252,.06) 1px,transparent 1px);
    background-size:40px 40px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:56px;position:relative}
  .rev{position:absolute;top:38px;right:56px;font-size:15px;letter-spacing:.26em;color:rgba(186,230,253,.45);text-transform:uppercase}
  .top{position:absolute;top:38px;left:60px;font-size:16px;letter-spacing:.2em;color:#7dd3fc;text-transform:uppercase}
  .kicker{font-size:26px;color:rgba(186,230,253,.6);letter-spacing:.02em;margin-bottom:6px}
  .big{font-size:210px;font-weight:800;line-height:.9;color:#7dd3fc;letter-spacing:-.02em;text-shadow:0 0 50px rgba(125,211,252,.5)}
  .big s{color:rgba(248,113,113,.55);font-size:64px;font-weight:600;vertical-align:middle;margin-right:26px;text-decoration-thickness:5px}
  .sub{font-size:38px;color:#e0f2fe;font-weight:600;margin-top:14px;letter-spacing:.01em}
  .sub b{color:#fef08a;font-weight:600}
  .row{display:flex;gap:16px;margin-top:34px}
  .chip{border:1px solid rgba(125,211,252,.45);padding:9px 20px;color:#7dd3fc;font-size:20px;letter-spacing:.04em}
  .foot{position:absolute;bottom:36px;font-size:19px;color:rgba(186,230,253,.55);letter-spacing:.05em}
  .foot b{color:#e0f2fe}
</style></head><body>
  <div class="top">Field note · dictation</div>
  <div class="rev">gal.tidhar.org.il</div>
  <div class="kicker">talking to your own laptop now costs</div>
  <div class="big"><s>$15/mo</s>$0</div>
  <div class="sub">the model was free the whole time. you were renting the <b>wrapper</b>.</div>
  <div class="row"><span class="chip">100% offline</span><span class="chip">open source · MIT</span><span class="chip">Handy</span></div>
  <div class="foot">speak <span style="color:#fef08a">→</span> type · runs on your machine · <b>gal.tidhar.org.il/blog/free-dictation</b></div>
</body></html>
