<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:'IBM Plex Mono';font-weight:400;src:url('file:///Users/galtidhar/PycharmProjects/gal-tidhar/fonts/ibm-plex-mono-400.woff2') format('woff2');}
@font-face{font-family:'IBM Plex Mono';font-weight:600;src:url('file:///Users/galtidhar/PycharmProjects/gal-tidhar/fonts/ibm-plex-mono-600.woff2') format('woff2');}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a1628;--grid:rgba(125,211,252,.07);--cyan:#7dd3fc;--ink:#e0f2fe;
--muted:rgba(186,230,253,.55);--accent:#fef08a;--red:#fca5a5;--border:rgba(125,211,252,.45)}
html,body{width:1200px;height:630px}
body{font-family:'IBM Plex Mono','Arial Hebrew','Arial Unicode MS',monospace;background:var(--bg);
color:var(--ink);overflow:hidden;
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
background-size:32px 32px}
.wrap{width:1200px;height:630px;padding:52px 64px;display:flex;flex-direction:column;position:relative}
.eyebrow{font-size:17px;letter-spacing:.16em;color:var(--cyan);opacity:.85;font-weight:600}
.foot{position:absolute;inset-inline-start:64px;bottom:34px;font-size:16px;color:var(--muted);direction:ltr}
.spacer{flex:1}
.accent{color:var(--accent)}.cy{color:var(--cyan)}.red{color:var(--red)}

.h{font-size:42px;font-weight:600;margin:16px 0 26px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.cell{border:1px solid var(--border);border-radius:10px;padding:20px 24px;background:rgba(15,40,71,.5)}
.n{font-size:20px;color:var(--cyan);font-weight:600;margin-bottom:6px}
.ct{font-size:30px;font-weight:600;color:var(--ink)}
.cs{font-size:22px;color:var(--muted);margin-top:6px}
</style></head><body><div class="wrap"><div class="eyebrow">קלוד קוד / כלכלת המטמון</div>
<div class="h">ארבעה מספרים שקובעים את החשבון</div>
<div class="grid"><div class="cell"><div class="n">1</div><div class="ct">קריאות מטמון</div><div class="cs">האם הפרפיקס יציב</div></div><div class="cell"><div class="n">2</div><div class="ct">התחלות קרות</div><div class="cs">חזרת אחרי שעה</div></div><div class="cell"><div class="n">3</div><div class="ct">חציון קונטקסט</div><div class="cs">כמה גדולה כל קריאה</div></div><div class="cell"><div class="n">4</div><div class="ct">הסשן הארוך ביותר</div><div class="cs">כמה פעמים נקרא מחדש</div></div></div>
<div class="spacer"></div><div class="foot">gal.tidhar.org.il</div></div></body></html>
