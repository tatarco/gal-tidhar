<!doctype html><html lang="en"><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#f2ede3;color:#123240;overflow:hidden;
 font-family:Georgia,"Times New Roman",serif;position:relative}
.head{padding:30px 34px 0}
.h1{font-size:35px;font-weight:700;line-height:1.18;letter-spacing:-.01em}
.h2{font-size:19px;color:#7c6a58;margin-top:9px;max-width:560px;font-family:-apple-system,Helvetica,Arial,sans-serif}
.stage{position:absolute;inset-block-end:24px;inset-inline-start:34px;
 display:flex;gap:26px;align-items:flex-end}
.col{display:flex;flex-direction:column;gap:9px;width:500px}
.shot{display:block;width:100%;border-radius:10px;
 box-shadow:0 14px 34px rgba(18,50,64,.20);border:1px solid rgba(18,50,64,.10)}
.card{width:610px;border-radius:14px;box-shadow:0 18px 44px rgba(18,50,64,.24);
 border:1px solid rgba(18,50,64,.10);display:block}
.site{position:absolute;inset-block-start:34px;inset-inline-end:34px;
 font-family:-apple-system,Helvetica,Arial,sans-serif;font-size:17px;color:#9b3d24;font-weight:600}
</style>
<body>
  <div class="head">
    <div class="h1">When do I need to be at the ferry,<br>and is it even running tonight?</div>
    <div class="h2">Live camera, the queue, and how the boats really ran today.</div>
  </div>
  <div class="stage">
    <div class="col">
      <img class="shot" src="pill.png">
      <img class="shot" src="cam.png">
    </div>
    <img class="card" src="card2.png">
  </div>
  <div class="site">croatianferries.com</div>
</body></html>
