<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:#0a1628;color:#bae6fd;font-family:'Arial Hebrew','SF Hebrew',system-ui,sans-serif;direction:rtl;
    background-image:linear-gradient(rgba(125,211,252,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(125,211,252,.07) 1px,transparent 1px);
    background-size:32px 32px;display:flex;flex-direction:column;justify-content:center;padding:48px 64px;position:relative}
  .top{position:absolute;top:36px;right:60px;font-size:19px;color:#7dd3fc;font-weight:700}
  .rev{position:absolute;top:38px;left:56px;font-size:15px;letter-spacing:.14em;color:rgba(186,230,253,.45);font-family:'SF Mono',Menlo,monospace;direction:ltr}
  .headline{font-size:56px;line-height:1.12;color:#e0f2fe;font-weight:800;text-align:center;margin-bottom:30px}
  .headline b{color:#7dd3fc}
  .cmp{display:flex;gap:24px}
  .card{flex:1;border-radius:12px;padding:24px 26px;display:flex;flex-direction:column;align-items:center;gap:14px}
  .card.bad{border:1px solid rgba(248,113,113,.42);background:rgba(248,113,113,.05)}
  .card.good{border:1px solid rgba(37,211,102,.5);background:rgba(37,211,102,.05)}
  .clbl{font-size:22px;letter-spacing:.02em}
  .bad .clbl{color:#f87171}.good .clbl{color:#25D366}
  .w{font-size:104px;font-weight:800;line-height:1}
  .bad .w{color:#f87171}.good .w{color:#7dd3fc;text-shadow:0 0 40px rgba(125,211,252,.45)}
  .foot{position:absolute;bottom:34px;left:64px;right:64px;display:flex;justify-content:space-between;align-items:center;font-size:21px;color:rgba(186,230,253,.7)}
  .foot b{color:#e0f2fe}
  .tag{border:1px solid rgba(125,211,252,.5);padding:7px 16px;color:#7dd3fc;font-size:18px;font-family:'SF Mono',Menlo,monospace;direction:ltr}
</style></head><body>
  <div class="top">Claude Code · עברית</div>
  <div class="rev">gal.tidhar.org.il</div>
  <div class="headline">אותה מילה. <b>גרסה חדשה</b> אחת של הבדל.</div>
  <div class="cmp">
    <div class="card good"><div class="clbl">✓ עכשיו · נייטיב</div><div class="w">שלום</div></div>
    <div class="card bad"><div class="clbl">✗ קודם · הפוך</div><div class="w">םולש</div></div>
  </div>
  <div class="foot"><span>אלגוריתם ה-<b>bidi</b> סוף סוף רץ בטרמינל</span><span class="tag">Claude Code v2.1.197</span></div>
</body></html>
