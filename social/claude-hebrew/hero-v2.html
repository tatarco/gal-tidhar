<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:#0a1628;color:#bae6fd;font-family:'Arial Hebrew','SF Hebrew',system-ui,sans-serif;direction:rtl;
    background-image:linear-gradient(rgba(125,211,252,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(125,211,252,.06) 1px,transparent 1px);
    background-size:40px 40px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:52px;position:relative}
  .top{position:absolute;top:36px;right:56px;font-size:19px;color:#7dd3fc;font-weight:700}
  .rev{position:absolute;top:38px;left:56px;font-size:15px;letter-spacing:.14em;color:rgba(186,230,253,.45);font-family:'SF Mono',Menlo,monospace;direction:ltr}
  .kicker{font-size:28px;color:rgba(186,230,253,.62);margin-bottom:6px}
  .big{font-size:205px;font-weight:800;line-height:.92;color:#7dd3fc;text-shadow:0 0 55px rgba(125,211,252,.5)}
  .sub{font-size:39px;color:#e0f2fe;font-weight:700;margin-top:16px}
  .sub b{color:#fef08a}
  .row{display:flex;gap:16px;margin-top:32px}
  .chip{border:1px solid rgba(125,211,252,.5);padding:10px 22px;color:#7dd3fc;font-size:22px}
  .chip.v{font-family:'SF Mono',Menlo,monospace;direction:ltr;font-size:19px}
  .foot{position:absolute;bottom:36px;font-size:21px;color:rgba(186,230,253,.6)}
  .foot b{color:#e0f2fe}
</style></head><body>
  <div class="top">Claude Code · עברית</div>
  <div class="rev">gal.tidhar.org.il</div>
  <div class="kicker">אחרי חודשים של טקסט הפוך במסוף</div>
  <div class="big">סוֹף&nbsp;סוֹף</div>
  <div class="sub">תמיכת עברית <b>נייטיב</b> ב-Claude Code.</div>
  <div class="row"><span class="chip">אלגוריתם bidi</span><span class="chip">עברית + קוד בשורה אחת</span><span class="chip v">v2.1.197</span></div>
  <div class="foot">גרסה חדשה · עברית שנקראת נכון · <b>gal.tidhar.org.il</b></div>
</body></html>
