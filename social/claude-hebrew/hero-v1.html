<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:#0a1628;color:#bae6fd;font-family:'Arial Hebrew','SF Hebrew',system-ui,sans-serif;direction:rtl;
    background-image:linear-gradient(rgba(125,211,252,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(125,211,252,.06) 1px,transparent 1px);
    background-size:40px 40px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:48px;position:relative}
  .top{position:absolute;top:36px;right:56px;font-size:19px;letter-spacing:.02em;color:#7dd3fc;font-weight:700}
  .rev{position:absolute;top:38px;left:56px;font-size:15px;letter-spacing:.14em;color:rgba(186,230,253,.45);font-family:'SF Mono',Menlo,monospace;direction:ltr}
  .kicker{font-size:27px;color:rgba(186,230,253,.62);margin-bottom:24px}
  .duo{display:flex;align-items:center;gap:48px;margin-bottom:14px}
  .cell{display:flex;flex-direction:column;align-items:center;gap:12px}
  .word{font-size:150px;font-weight:800;line-height:1}
  .bad{color:#f87171;text-shadow:0 0 45px rgba(248,113,113,.32)}
  .good{color:#7dd3fc;text-shadow:0 0 55px rgba(125,211,252,.5)}
  .lab{font-size:23px;letter-spacing:.02em}
  .lb{color:rgba(248,113,113,.9)}.lg{color:#25D366}
  .arrow{font-size:66px;color:#fef08a;font-weight:400}
  .sub{font-size:40px;color:#e0f2fe;font-weight:700;margin-top:22px}
  .sub b{color:#7dd3fc}
  .foot{position:absolute;bottom:34px;left:56px;right:56px;display:flex;justify-content:space-between;align-items:center;font-size:21px;color:rgba(186,230,253,.7)}
  .foot b{color:#e0f2fe}
  .tag{border:1px solid rgba(125,211,252,.5);padding:7px 16px;color:#7dd3fc;font-size:18px;font-family:'SF Mono',Menlo,monospace;direction:ltr}
</style></head><body>
  <div class="top">Claude Code · עברית</div>
  <div class="rev">gal.tidhar.org.il</div>
  <div class="kicker">ככה הטרמינל הציג עברית עד עכשיו - הפוך, אות אחרי אות</div>
  <div class="duo">
    <div class="cell"><div class="word good">שלום</div><div class="lab lg">✓ עכשיו</div></div>
    <div class="arrow">←</div>
    <div class="cell"><div class="word bad">םולש</div><div class="lab lb">✗ קודם</div></div>
  </div>
  <div class="sub">סוף סוף עברית <b>נקראת נכון</b> ב-Claude Code.</div>
  <div class="foot"><span>גרסה חדשה · תמיכת <b>bidi</b> נייטיב בטרמינל</span><span class="tag">v2.1.197</span></div>
</body></html>
